name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (overrides VERSION file)'
        required: false

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          RAW_VERSION="$INPUT_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="$(cat VERSION)"
          fi
          # Validate version format to prevent injection
          if ! echo "$RAW_VERSION" | grep -qP '^v?\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$'; then
            echo "Invalid version format: $RAW_VERSION" >&2
            exit 1
          fi
          # Strip optional leading v; store bare version and tag version separately
          BARE="${RAW_VERSION#v}"
          echo "VERSION=$BARE" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=v$BARE" >> $GITHUB_OUTPUT
          echo "Bare version: $BARE"
          echo "Tag version: v$BARE"

      - name: Check existing tag
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$TAG"^{commit})
            THIS_COMMIT="${{ github.sha }}"
            if [ "$TAG_COMMIT" != "$THIS_COMMIT" ]; then
              echo "Tag $TAG exists but points to $TAG_COMMIT, not $THIS_COMMIT" >&2
              echo "Resolve by deleting the remote tag or bumping the version" >&2
              exit 1
            fi
            echo "exists_at_current=true" >> $GITHUB_OUTPUT
          else
            echo "exists_at_current=false" >> $GITHUB_OUTPUT
          fi

      # ---- Build phase (no publishing) ----

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.tag_check.outputs.exists_at_current != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.tag_check.outputs.exists_at_current != 'true'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Build UI
        if: steps.tag_check.outputs.exists_at_current != 'true'
        run: |
          npm ci
          npm run build
          mkdir -p ../../internal/web/static
          cp -r dist/* ../../internal/web/static/
        working-directory: web/ui

      - name: Build binaries
        if: steps.tag_check.outputs.exists_at_current != 'true'
        id: build_binaries
        run: |
          for name in driver web; do
            binary="blt-volume-manager-${name}"
            pkg="./cmd/${name}"
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
                go build -ldflags "-s -w \
                  -X github.com/TheGeb/BLT-Volume-Manager/internal/app.Version=${{ steps.version.outputs.VERSION }} \
                  -X github.com/TheGeb/BLT-Volume-Manager/internal/app.Commit=${GITHUB_SHA} \
                  -X github.com/TheGeb/BLT-Volume-Manager/internal/app.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "${binary}-linux-${arch}" "${pkg}"
            done
          done

      - name: Generate checksums
        if: steps.tag_check.outputs.exists_at_current != 'true'
        run: |
          sha256sum blt-volume-manager-*-linux-* > checksums.txt
          cat checksums.txt

      # ---- Publish phase ----

      - name: Login to GitHub Container Registry
        if: steps.tag_check.outputs.exists_at_current != 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.tag_check.outputs.exists_at_current != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push all images
        if: steps.tag_check.outputs.exists_at_current != 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
        run: docker buildx bake -f docker-bake.hcl --push

      - name: Create git tag
        if: steps.tag_check.outputs.exists_at_current != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="${{ steps.version.outputs.TAG_VERSION }}"
          git tag "$TAG" ${{ github.sha }}
          git push origin "$TAG"

      - name: Create Release
        if: steps.tag_check.outputs.exists_at_current != 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.TAG_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            blt-volume-manager-driver-linux-amd64
            blt-volume-manager-driver-linux-arm64
            blt-volume-manager-web-linux-amd64
            blt-volume-manager-web-linux-arm64
            checksums.txt
