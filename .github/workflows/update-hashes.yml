name: Update Nix hashes

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'web/ui/package.json'
      - 'web/ui/package-lock.json'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'web/ui/package.json'
      - 'web/ui/package-lock.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hashes
        run: make nix-vendor-hash nix-npm-hash

      - name: Commit changes
        run: |
          if [ -z "$(git diff --stat flake.nix)" ]; then
            echo "No changes — hashes are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update nix dependency hashes"
          git push
