name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: internal/web/static

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Tidy
        run: go mod tidy

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Test
        run: go test -race ./... -short -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Arch dependency tests
        run: go test -run 'TestNo(WebDriver|DriverWeb)Dependency' . -count=1

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Svelte check
        run: npx svelte-check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: internal/web/static

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
