name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Create dummy UI files for embed
        run: mkdir -p internal/web/static && touch internal/web/static/.dummy

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Tidy
        run: go mod tidy

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Create dummy UI files for embed
        run: mkdir -p internal/web/static && touch internal/web/static/.dummy

      - name: Test
        run: go test -race ./... -short -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Arch dependency tests
        run: go test -run 'TestNo(WebDriver|DriverWeb)Dependency' ./test -count=1

  ui-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Svelte check
        run: npx svelte-check

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: internal/web/static

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
